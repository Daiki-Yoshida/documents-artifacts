name: Issue 199 branch validation (temporary)
on:
  push:
    branches:
      - fix/project-root-write-boundary
permissions:
  contents: read
jobs:
  shell-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm pinned test context
        run: |
          git rev-parse HEAD
          bash --version | head -1
          git --version
      - name: Shell syntax
        run: |
          bash -n tests/test-artifacts.sh
          bash -n tests/test-knowledge-integrity.sh
          bash -n tests/test-agent-harness.sh
          bash -n tests/scripts/prepare-agent-test.sh
          bash -n tests/scripts/capture-agent-test.sh
      - name: Artifact delivery regression
        run: bash tests/test-artifacts.sh
      - name: Knowledge integrity
        run: bash tests/test-knowledge-integrity.sh
      - name: Agent harness deterministic suite
        run: bash tests/test-agent-harness.sh
