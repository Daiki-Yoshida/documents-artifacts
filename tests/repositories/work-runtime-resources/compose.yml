services:
  app:
    image: work-runtime-dev:node20
    build: .
    working_dir: /workspace
    command: node src/app.js
    environment:
      APP_PORT: "3000"
      NPM_CONFIG_CACHE: /cache
    ports:
      - "${APP_HOST_PORT:-8080}:3000"
    volumes:
      - .:/workspace
      - pkg-cache:/cache
      - db-data:/data
volumes:
  pkg-cache:
    name: dev-pkg-cache
  db-data:
